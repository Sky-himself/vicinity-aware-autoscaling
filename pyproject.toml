[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vicinity-aware-autoscaling"
version = "0.1.0"
description = "Thesis research on vicinity-aware proactive autoscaling for containerized edge clusters"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/Sky-himself/vicinity-aware-autoscaling"
Simulator = "https://github.com/ECTLab/HierarchicalEdgeSim"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
plot = [
    "matplotlib>=3.8",
]
tcn = [
    "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
